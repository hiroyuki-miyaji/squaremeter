<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防災倉庫候補マイニング</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f5;
  --border:#e2e6ea;--border2:#d0d7de;
  --accent:#e8410a;--accent-l:#fff1ec;
  --day:#1a7fe8;--day-l:#e8f2fd;
  --night:#7c3aed;--night-l:#f3eefe;
  --both:#0d9488;--both-l:#ccfbf1;
  --safe:#16a34a;--safe-l:#dcfce7;
  --warn:#d97706;--warn-l:#fef9c3;
  --danger:#dc2626;--danger-l:#fee2e2;
  --text:#1a1f2e;--text2:#4b5563;--muted:#9ca3af;
  --shadow:0 4px 16px rgba(0,0,0,.10);
  --shadow-lg:0 8px 32px rgba(0,0,0,.15);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);height:100%;overflow:hidden;}

/* ── HEADER ── */
header{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0;z-index:20;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.logo{width:30px;height:30px;background:linear-gradient(135deg,#e8410a,#ff6b35);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.logo-text{font-size:13px;font-weight:700;}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;}
.h-div{width:1px;height:24px;background:var(--border);flex-shrink:0;}
.h-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.h-label{font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap;}
select,input[type=text],input[type=number]{background:var(--surface);border:1px solid var(--border2);color:var(--text);padding:4px 8px;border-radius:6px;font-size:11px;font-family:inherit;outline:none;}
select:focus,input:focus{border-color:var(--accent);}
.btn{border:none;border-radius:7px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;padding:5px 12px;transition:all .18s;white-space:nowrap;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover:not(:disabled){background:#c73508;}
.btn-safe{background:var(--safe);color:#fff;}
.btn-safe:hover:not(:disabled){background:#15803d;}
.btn-ghost{background:var(--surface);border:1.5px solid var(--border2);color:var(--text2);}
.btn-ghost:hover:not(:disabled){border-color:var(--day);color:var(--day);}
.btn-warn{background:var(--warn);color:#fff;}
.btn-warn:hover:not(:disabled){background:#b45309;}
.btn:disabled{opacity:.35;cursor:not-allowed;}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;height:100vh;}
.body{display:flex;flex:1;overflow:hidden;min-height:0;}

/* ── LEFT PANEL ── */
.left{width:340px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.panel-head{padding:9px 13px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px;}
.panel-title{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;}
.panel-count{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-l);border-radius:20px;padding:2px 8px;white-space:nowrap;}
.needed-bar{padding:8px 13px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.needed-bar label{font-size:10px;font-weight:600;color:var(--muted);}
.needed-bar input{width:52px;}
.progress-wrap{flex:1;display:flex;align-items:center;gap:6px;min-width:0;}
.progress-track{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:5px;border-radius:3px;transition:width .4s;}
.progress-text{font-size:10px;font-weight:700;white-space:nowrap;}

.candidate-list{overflow-y:auto;flex:1;}
.candidate-list::-webkit-scrollbar{width:4px;}
.candidate-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* カード */
.cand-card{padding:10px 13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;position:relative;}
.cand-card:hover{background:var(--surface2);}
.cand-card.selected{background:var(--accent-l);border-left:3px solid var(--accent);}
.cand-top{display:flex;align-items:center;gap:4px;margin-bottom:3px;flex-wrap:wrap;}
.kb{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;}
.kb-day  {background:var(--day-l);color:var(--day);}
.kb-night{background:var(--night-l);color:var(--night);}
.kb-both {background:var(--both-l);color:var(--both);}
.type-b{font-size:8px;padding:1px 5px;border-radius:3px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.status-b{font-size:8px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:auto;}
.st-cand{background:#F1EFE8;color:#444441;}
.st-eval{background:var(--warn-l);color:#92400e;}
.st-approved{background:var(--safe-l);color:#15803d;}
.hz-b{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;}
.hz-clear{background:var(--safe-l);color:var(--safe);}
.hz-warn {background:var(--warn-l);color:var(--warn);}
.hz-red  {background:var(--danger-l);color:var(--danger);}
.hz-chk  {background:var(--surface2);color:var(--muted);}
.cand-name{font-size:11px;font-weight:700;line-height:1.4;margin-bottom:1px;padding-right:36px;}
.cand-addr{font-size:9px;color:var(--muted);}
.cand-dist{position:absolute;right:11px;top:10px;font-size:9px;color:var(--muted);}
.cand-score{font-size:9px;font-weight:700;margin-top:3px;}
.sc-high{color:var(--safe);}
.sc-mid {color:var(--warn);}
.sc-low {color:var(--danger);}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--muted);font-size:12px;gap:8px;text-align:center;padding:0 20px;}

/* ── MAP ── */
.map-wrap{flex:1;position:relative;}
#map{width:100%;height:100%;background:#e8edf2;}
.map-ctl{position:absolute;top:10px;left:10px;z-index:10;display:flex;flex-direction:column;gap:7px;}
.map-card{background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:9px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.08);backdrop-filter:blur(6px);}
.search-row{display:flex;gap:5px;}
.search-input{width:200px;font-size:11px;}
.status-pill{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:500;color:var(--text2);}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--safe);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

/* ── DETAIL PANEL ── */
.dp{position:absolute;bottom:14px;right:14px;width:360px;background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--shadow-lg);display:none;z-index:100;max-height:calc(100vh - 76px);overflow-y:auto;}
.dp.visible{display:block;animation:slideUp .2s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.dp-head{padding:11px 13px 9px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:9px;position:sticky;top:0;z-index:1;}
.dp-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:var(--accent-l);}
.dp-title{font-size:12px;font-weight:700;line-height:1.4;}
.dp-sub{font-size:9px;color:var(--muted);margin-top:2px;}
.dp-close{margin-left:auto;background:var(--border);border:none;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;}
.dp-body{padding:11px 12px;}

/* マップリンクボタン */
.map-links{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap;}
.map-link{font-size:10px;font-weight:700;padding:5px 10px;border-radius:6px;text-decoration:none;border:1.5px solid;transition:all .15s;display:flex;align-items:center;gap:4px;}
.ml-map {border-color:var(--day);color:var(--day);background:var(--day-l);}
.ml-sv  {border-color:var(--both);color:var(--both);background:var(--both-l);}
.ml-pl  {border-color:var(--muted);color:var(--text2);background:var(--surface2);border-color:var(--border2);}
.ml-map:hover{background:#bfdbfe;}
.ml-sv:hover {background:#99f6e4;}
.ml-pl:hover {background:var(--border);}

/* スコアセクション */
.score-sec{background:var(--surface2);border-radius:8px;padding:9px;margin-bottom:10px;}
.score-total-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.dp-sec-label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.score-badge{font-size:14px;font-weight:900;padding:2px 9px;border-radius:20px;}
.sb-high{background:var(--safe-l);color:#15803d;}
.sb-mid {background:var(--warn-l);color:#92400e;}
.sb-low {background:var(--danger-l);color:var(--danger);}
.sbar-row{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.sbar-name{font-size:9px;color:var(--text2);width:54px;flex-shrink:0;}
.sbar-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.sbar-fill{height:4px;border-radius:2px;transition:width .4s;}
.sbar-high{background:var(--safe);}
.sbar-mid {background:var(--warn);}
.sbar-low {background:var(--danger);}
.sbar-val{font-size:9px;font-weight:600;color:var(--text2);width:20px;text-align:right;}

/* ハザード */
.hz-res{border-radius:7px;padding:8px 10px;margin-bottom:10px;font-size:10px;line-height:1.6;}
.hz-res.clear{background:var(--safe-l);color:#15803d;border:1px solid #bbf7d0;}
.hz-res.warn {background:var(--warn-l);color:#92400e;border:1px solid #fde68a;}
.hz-res.red  {background:var(--danger-l);color:var(--danger);border:1px solid #fca5a5;}
.hz-res.checking{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.hz-links{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.hz-link{font-size:9px;font-weight:700;padding:4px 8px;border-radius:5px;text-decoration:none;border:1.5px solid;transition:all .15s;}
.hz-link.flood  {border-color:var(--day);color:var(--day);background:var(--day-l);}
.hz-link.debris {border-color:var(--warn);color:var(--warn);background:var(--warn-l);}
.hz-link.tsunami{border-color:var(--danger);color:var(--danger);background:var(--danger-l);}
.hz-link.shelter{border-color:var(--safe);color:var(--safe);background:var(--safe-l);}

/* グリッド */
.dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px;}
.dp-cell{background:var(--surface2);border-radius:5px;padding:6px 8px;}
.dp-cl{font-size:8px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px;}
.dp-cv{font-size:10px;font-weight:500;color:var(--text);}

/* テキストフィールド */
.dp-sec{margin-bottom:10px;}
.dp-field{font-size:10px;color:var(--text);line-height:1.6;background:var(--surface2);border-radius:6px;padding:7px 9px;}
.dp-field.generating{color:var(--muted);font-style:italic;}

/* 条件付き認定 */
.condition-box{background:var(--warn-l);border:1px solid #fde68a;border-radius:7px;padding:9px;margin-bottom:10px;}
.condition-box label{font-size:9px;font-weight:700;color:#92400e;display:block;margin-bottom:5px;}
.condition-box textarea{width:100%;border:1px solid #fde68a;border-radius:5px;background:#fff;font-size:10px;font-family:inherit;padding:6px;resize:vertical;min-height:50px;color:var(--text);}
.condition-box textarea:focus{outline:none;border-color:var(--warn);}

/* 再検討ボックス */
.reconsider-box{background:var(--danger-l);border:1px solid #fca5a5;border-radius:7px;padding:9px;margin-bottom:10px;display:none;}
.reconsider-box.visible{display:block;}
.reconsider-box label{font-size:9px;font-weight:700;color:var(--danger);display:block;margin-bottom:5px;}
.reconsider-box textarea{width:100%;border:1px solid #fca5a5;border-radius:5px;background:#fff;font-size:10px;font-family:inherit;padding:6px;resize:vertical;min-height:40px;color:var(--text);}
.reconsider-box textarea:focus{outline:none;border-color:var(--danger);}

/* アクションボタン群 */
.dp-actions{display:flex;flex-direction:column;gap:6px;}
.dp-action-row{display:grid;gap:6px;}
.row-2{grid-template-columns:1fr 1fr;}
.row-1{grid-template-columns:1fr;}
.btn-register{background:var(--safe);color:#fff;border:none;border-radius:7px;padding:9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .18s;}
.btn-register:hover:not(:disabled){background:#15803d;}
.btn-register:disabled{opacity:.35;cursor:not-allowed;}
.btn-reconsider{background:var(--surface);border:1.5px solid var(--danger);color:var(--danger);border-radius:7px;padding:9px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .18s;}
.btn-reconsider:hover{background:var(--danger-l);}
.btn-regen{background:var(--surface);border:1.5px solid var(--border2);color:var(--text2);border-radius:7px;padding:9px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .18s;}
.btn-regen:hover{background:var(--surface2);}
.dp-dup-msg{font-size:10px;color:var(--danger);margin-top:6px;}
.approved-msg{font-size:10px;color:var(--safe);font-weight:600;padding:8px;background:var(--safe-l);border-radius:6px;text-align:center;}
.condition-display{font-size:10px;color:#92400e;background:var(--warn-l);border:1px solid #fde68a;border-radius:6px;padding:7px 9px;margin-bottom:8px;}

/* ローディング */
.loading-ov{position:fixed;inset:0;background:rgba(255,255,255,.82);display:none;z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:11px;backdrop-filter:blur(4px);}
.loading-ov.visible{display:flex;}
.spinner{width:34px;height:34px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:12px;font-weight:500;color:var(--text2);}

/* トースト */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(70px);background:#1a1f2e;color:#fff;padding:9px 18px;border-radius:7px;font-size:11px;font-weight:500;transition:transform .28s;z-index:9999;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.success{background:var(--safe);}
.toast.error  {background:var(--danger);}

/* モーダル */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;}
.modal-ov.visible{display:flex;}
.modal{background:var(--surface);border-radius:12px;padding:22px;width:380px;box-shadow:var(--shadow-lg);}
.modal-title{font-size:14px;font-weight:700;margin-bottom:6px;}
.modal-desc{font-size:11px;color:var(--text2);margin-bottom:12px;line-height:1.6;}
.modal-textarea{width:100%;border:1px solid var(--border2);border-radius:7px;padding:8px;font-size:11px;font-family:inherit;resize:vertical;min-height:60px;margin-bottom:12px;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<header>
  <div class="logo">🔍</div>
  <div>
    <div class="logo-text">防災倉庫 候補マイニング</div>
    <div class="logo-sub">Disaster Warehouse Finder</div>
  </div>
  <div class="h-div"></div>
  <div class="h-ctrl">
    <span class="h-label">起点エリア</span>
    <select id="areaSelect" onchange="onAreaChange()" style="max-width:180px;"><option value="">-- 選択 --</option></select>
  </div>
  <div class="h-div"></div>
  <div class="h-ctrl">
    <span class="h-label">昼夜</span>
    <select id="kubunFilter" onchange="renderList()">
      <option value="all">全て</option>
      <option value="昼間">昼間</option>
      <option value="夜間">夜間</option>
      <option value="昼夜間">昼夜間</option>
    </select>
  </div>
  <div class="h-div"></div>
  <button class="btn btn-accent" id="searchBtn" onclick="startSearch()" disabled>🔍 候補を検索</button>
  <button class="btn btn-ghost"  id="addBtn"    onclick="searchAdditional()" disabled style="margin-left:3px;">＋ 追加検索</button>
  <button class="btn btn-ghost"  onclick="clearResults()" style="margin-left:3px;">クリア</button>
</header>

<!-- BODY -->
<div class="body">

  <!-- LEFT -->
  <div class="left">
    <div class="panel-head">
      <span class="panel-title">候補施設</span>
      <span class="panel-count" id="candidateCount">0 件</span>
    </div>
    <div class="needed-bar">
      <label>目標台数</label>
      <input type="number" id="neededInput" value="5" min="1" max="50" style="width:50px;" oninput="updateProgress()">
      <span class="h-label">台</span>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%;background:var(--warn);"></div></div>
        <span class="progress-text" id="progressText">0/5</span>
      </div>
    </div>
    <div class="candidate-list" id="candidateList">
      <div class="empty-state"><div style="font-size:30px;opacity:.4;">🏪</div><div>エリアを選択して<br>「候補を検索」を押してください</div></div>
    </div>
  </div>

  <!-- MAP -->
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-ctl">
      <div class="map-card">
        <div class="search-row">
          <input type="text" id="addrInput" class="search-input" placeholder="住所で起点を指定...">
          <button class="btn btn-accent" onclick="geocodeAddress()">指定</button>
        </div>
      </div>
      <div class="map-card">
        <div class="status-pill"><span class="sdot"></span><span id="statusText">エリアを選択してください</span></div>
      </div>
    </div>

    <!-- DETAIL PANEL -->
    <div class="dp" id="detailPanel">
      <div class="dp-head">
        <div class="dp-icon" id="dpIcon">🏪</div>
        <div style="flex:1;min-width:0;">
          <div class="dp-title" id="dpTitle">-</div>
          <div class="dp-sub"  id="dpSub">-</div>
        </div>
        <button class="dp-close" onclick="closeDetail()">✕</button>
      </div>
      <div class="dp-body">

        <!-- Googleマップリンク -->
        <div class="map-links" id="dpMapLinks"></div>

        <!-- スコアセクション -->
        <div class="score-sec" id="dpScoreSec">
          <div class="score-total-row">
            <span class="dp-sec-label">総合スコア（AI評価）</span>
            <span class="score-badge" id="dpScoreBadge">-</span>
          </div>
          <div id="dpScoreBars"></div>
        </div>

        <!-- ハザード -->
        <div class="dp-sec">
          <div class="dp-sec-label" style="margin-bottom:5px;">⚠️ ハザード自動判定</div>
          <div class="hz-res checking" id="dpHazard">判定中...</div>
          <div class="hz-links" id="dpHzLinks"></div>
        </div>

        <!-- 基本情報 -->
        <div class="dp-grid">
          <div class="dp-cell"><div class="dp-cl">住所</div><div class="dp-cv" id="dpAddr">-</div></div>
          <div class="dp-cell"><div class="dp-cl">距離 / 徒歩</div><div class="dp-cv" id="dpDist">-</div></div>
          <div class="dp-cell"><div class="dp-cl">昼夜区分</div><div class="dp-cv" id="dpKubun">-</div></div>
          <div class="dp-cell"><div class="dp-cl">施設種類</div><div class="dp-cv" id="dpType">-</div></div>
        </div>

        <!-- 条件表示（認定済み） -->
        <div id="dpConditionDisplay" style="display:none;" class="condition-display"></div>

        <!-- Claude生成 -->
        <div class="dp-sec">
          <div class="dp-sec-label" style="margin-bottom:5px;">📝 選定理由（AI生成）</div>
          <div class="dp-field" id="dpReason"></div>
        </div>
        <div class="dp-sec">
          <div class="dp-sec-label" style="margin-bottom:5px;">📦 推奨備蓄品（AI生成）</div>
          <div class="dp-field" id="dpStock"></div>
        </div>
        <div class="dp-sec">

async function loadAreas() {
  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/%E3%82%A8%E3%83%AA%E3%82%A2%E4%B8%80%E8%A6%A7?key=${SHEETS_KEY}`;

    const sel  = document.getElementById("areaSelect");
    rows.forEach(r => {
      if (!r["エリア番号"]) return;
      const o = document.createElement("option");
      o.value = r["エリア番号"];
      o.textContent = `${r["エリア番号"]}  ${r["エリア名称"]||""}`;

function parseSheets(json) {
  const rows = json.values;
  if (!rows || rows.length < 2) return [];
  const h = rows[0];
  return rows.slice(1).map(row => { const o={}; h.forEach((k,i)=>o[k]=row[i]!==undefined?String(row[i]):""); return o; });
}

async function runSearch(isAdditional = false) {
  if (!currentArea) return;
  showLoading(isAdditional ? "追加候補を検索中..." : "Google Mapsから実在施設を検索中...");
  try {
    const center   = new google.maps.LatLng(currentArea.lat, currentArea.lng);
    const allRes   = await Promise.all(PLACE_TYPES.map(t => searchNearby(center, t)));
    const existIds = new Set(candidates.map(c => c.id));

    let raw = [];
    const seen = new Set(existIds);
    allRes.flat().forEach(p => {
      if (seen.has(p.place_id)) return;
      seen.add(p.place_id);
      const dist = calcDist(currentArea.lat, currentArea.lng, p.geometry.location.lat(), p.geometry.location.lng());
      if (dist > SEARCH_RADIUS) return;
      raw.push({ place: p, dist: Math.round(dist) });
    });
    raw.sort((a, b) => a.dist - b.dist);

    const newCands = raw.map((item, i) => {
      const p    = item.place;
      const type = getBestType(p.types);
      const lat  = p.geometry.location.lat();
      const lng  = p.geometry.location.lng();
      return {
        id: p.place_id, placeId: p.place_id,
        idx: candidates.length + i,
        name: p.name, address: p.vicinity || "",
        lat, lng, type: TYPE_LABELS[type]||type, typeKey: type,
        dist: item.dist,
        distStr: item.dist>=1000?(item.dist/1000).toFixed(1)+"km":item.dist+"m",
        walk: Math.round(item.dist/80)+"分",
        kubun: guessKubun(type),
        status: ST_CAND,
        reason: null, stock: null, stockReason: null, scores: null,
        hazard: null, condition: "",
        reconsiderReason: "", reconsiderDate: "",
        duplicate: false,
        isOpen: p.isOpen,
        rating: p.rating || null,
        ratingCount: p.user_ratings_total || null,
      };
    });

    // インデックス再割り当て
    newCands.forEach((c, i) => { c.idx = candidates.length + i; });
    candidates.push(...newCands);

    setStatus(`${candidates.length} 件の実在施設を表示中${isAdditional ? "（追加済み）" : ""}`);
    renderList();
    placeMarkers();
    updateProgress();

    runHazardChecks(newCands);
  } catch(e) {
    console.error(e);
    showToast("検索エラー: " + e.message, "error");
  } finally {
    hideLoading();
  }
}

async function searchNearby(center, type) {
  // Places API New（Nearby Search）
  const typeMap = {
    "convenience_store":"convenience_store","supermarket":"supermarket",
    "drugstore":"drugstore","pharmacy":"pharmacy",
    "shopping_mall":"shopping_mall","department_store":"department_store",
    "gas_station":"gas_station","bank":"bank",
    "community_center":"community_center","school":"school","hospital":"hospital"
  };
  const body = {
    includedTypes: [typeMap[type] || type],
    maxResultCount: 20,
    locationRestriction: {
      circle: {
        center: { latitude: center.lat(), longitude: center.lng() },
        radius: SEARCH_RADIUS
      }
    }
  };
  try {
    const res  = await fetch("https://places.googleapis.com/v1/places:searchNearby", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Goog-Api-Key": MAPS_KEY,
        "X-Goog-FieldMask": "places.id,places.displayName,places.formattedAddress,places.location,places.types,places.businessStatus,places.regularOpeningHours,places.rating,places.userRatingCount"
      },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!data.places) return [];
    // 旧APIと同じ形式に正規化
    return data.places
      .filter(p => p.businessStatus !== "CLOSED_PERMANENTLY")
      .map(p => ({
        place_id: p.id,
        name: p.displayName?.text || "",
        vicinity: p.formattedAddress || "",
        types: p.types || [],
        geometry: {
          location: {
            lat: () => p.location.latitude,
            lng: () => p.location.longitude
          }
        },
        business_status: p.businessStatus,
        rating: p.rating,
        user_ratings_total: p.userRatingCount,
        opening_hours: p.regularOpeningHours,
        // 新機能版追加情報
        isOpen: p.regularOpeningHours?.openNow,
      }));
  } catch(e) {
    console.warn("Places API New失敗、従来版にフォールバック:", type, e);
    return legacySearchNearby(center, type);
  }
}

// フォールバック用（従来版）
function legacySearchNearby(center, type) {
  return new Promise(res => {
    PlacesService.nearbySearch({ location: center, radius: SEARCH_RADIUS, type }, (results, status) => {
      res(status === "OK" ? results : []);
    });
  });
}

function getBestType(types) {
  for (const t of PLACE_TYPES) if (types.includes(t)) return t;
  return types[0] || "default";
}

function guessKubun(typeKey) {
  const dayOnly   = ["school","community_center","shopping_mall","department_store"];
  const nightOk   = ["convenience_store","gas_station"];
  if (dayOnly.includes(typeKey))  return "昼間";
  if (nightOk.includes(typeKey))  return "昼夜間";
  return "昼夜間";
}

// ============================================================
// ハザード判定
// ============================================================
async function runHazardChecks(targets) {
  const BATCH = 3;
  const list  = targets || candidates;
  for (let i = 0; i < list.length; i += BATCH) {
    await Promise.all(list.slice(i, i + BATCH).map(c => checkHazard(c)));
    renderList();
    if (selectedIdx !== null && list.find(c => c.idx === selectedIdx)) showDetailPanel(candidates[selectedIdx]);
  }
}

async function checkHazard(cand) {
  try {
    const z = 14;
    const [flood, debris, tsunami] = await Promise.all([
      getTilePixel(cand.lat, cand.lng, z, "flood_l2_keizoku"),
      getTilePixel(cand.lat, cand.lng, z, "dosya_keikai_dosekiryu"),
      getTilePixel(cand.lat, cand.lng, z, "tsunamishinsui_raster"),
    ]);
    const flags = [];
    if (isHazardPixel(flood,  "flood"))   flags.push("🌊 洪水浸水想定区域");
    if (isHazardPixel(debris, "debris"))  flags.push("⛰️ 土砂災害警戒区域");
    if (isHazardPixel(tsunami,"tsunami")) flags.push("🌏 津波浸水想定区域");
    if (flags.length > 0) {
      cand.hazard = { level:"warn", detail:"⚠️ ハザードエリアの可能性：\n"+flags.join("\n")+"\n\nポータルで詳細を確認してください。" };
    } else {
      cand.hazard = { level:"clear", detail:"✅ ハザードリスクなし（洪水・土砂・津波 3種確認済み）" };
    }
  } catch(e) {
    cand.hazard = { level:"checking", detail:"判定できませんでした（ポータルで確認してください）" };
  }
}

async function getTilePixel(lat, lng, z, layer) {
  const n  = Math.pow(2, z);
  const tx = Math.floor((lng + 180) / 360 * n);
  const lr = lat * Math.PI / 180;
  const ty = Math.floor((1 - Math.log(Math.tan(lr) + 1/Math.cos(lr))/Math.PI)/2 * n);
  const px = Math.floor(((lng+180)/360*n - tx)*256);
  const py = Math.floor(((1-Math.log(Math.tan(lr)+1/Math.cos(lr))/Math.PI)/2*n - ty)*256);
  const url = `https://cyberjapandata.gsi.go.jp/xyz/${layer}/${z}/${tx}/${ty}.png`;
  return new Promise(res => {
    const img = new Image(); img.crossOrigin = "anonymous";
    img.onload = () => {
      try {
        const cvs = document.createElement("canvas"); cvs.width = cvs.height = 256;
        const ctx = cvs.getContext("2d"); ctx.drawImage(img,0,0);
        const d = ctx.getImageData(px,py,1,1).data;
        res({r:d[0],g:d[1],b:d[2],a:d[3]});
      } catch(e){res(null);}
    };
    img.onerror = () => res(null);
    img.src = url;
  });
}

function isHazardPixel(p, type) {
  if (!p || p.a < 10) return false;
  if (type==="flood")   return p.b > 100 && p.b > p.r * 1.3;
  if (type==="debris")  return p.r > 150 && p.g < 100;
  if (type==="tsunami") return p.b > 100 && p.g > 80;
  return false;
}

async function generateWithClaude(cand) {
  if (!CLAUDE_KEY || CLAUDE_KEY === "YOUR_CLAUDE_API_KEY") {
    cand.reason = "（Claude APIキー未設定）"; cand.stock = "（未設定）"; cand.stockReason = "（未設定）";
    cand.scores = {disaster:70,visibility:70,population:70,access:70,land:70,total:70};
    cand.status = ST_EVAL; return;
  }
  const prompt = `あなたは防災戦略コンサルタントです。以下の施設を防災倉庫設置候補として評価してください。

【起点エリア】${currentArea?.name||""}（${currentArea?.address||""}）
【候補施設】
- 施設名：${cand.name}
- 種類：${cand.type}
- 住所：${cand.address}
- 中心地からの距離：${cand.distStr}（徒歩${cand.walk}）
- 昼夜区分：${cand.kubun}
- 営業状況：${cand.isOpen !== undefined ? (cand.isOpen ? '営業中' : '営業時間外') : '不明'}
- Google評価：${cand.rating ? cand.rating + '点（' + cand.ratingCount + '件）' : '不明'}

JSONのみで回答（他テキスト不要）：
{"reason":"選定理由100字以内","stock":"必須：A、B ／ 推奨：C、D","stock_reason":"備蓄品選定理由60字以内","score_disaster":整数,"score_visibility":整数,"score_population":整数,"score_access":整数,"score_land":整数}`;

  try {
    const res  = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:600,
        messages:[{role:"user",content:prompt}] })
    });
    const data   = await res.json();
    const text   = data.content?.[0]?.text || "{}";
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
    cand.reason      = parsed.reason       || "-";
    cand.stock       = parsed.stock        || "-";
    cand.stockReason = parsed.stock_reason || "-";
    const sc = {
      disaster:   parseInt(parsed.score_disaster)   ||70,
      visibility: parseInt(parsed.score_visibility) ||70,
      population: parseInt(parsed.score_population) ||70,
      access:     parseInt(parsed.score_access)     ||70,
      land:       parseInt(parsed.score_land)       ||70,
    };
    sc.total = Math.round((sc.disaster+sc.visibility+sc.population+sc.access+sc.land)/5);
    cand.scores = sc;
    cand.status = ST_EVAL;
  } catch(e) {
    cand.reason = "生成に失敗しました（"+e.message+")";
    cand.status = ST_EVAL;
  }
}

function renderList() {
  const list   = document.getElementById("candidateList");
  const kubun  = document.getElementById("kubunFilter").value;
  const shown  = kubun==="all" ? candidates : candidates.filter(c=>c.kubun===kubun);

  document.getElementById("candidateCount").textContent = candidates.length + " 件";
  list.innerHTML = "";
  if (!shown.length) {
    list.innerHTML = `<div class="empty-state"><div style="font-size:28px;opacity:.4;">📭</div><div>候補がありません</div></div>`;
    return;
  }

  shown.forEach(c => {
    const hz    = c.hazard;
    const hzCls = !hz?"hz-chk":hz.level==="clear"?"hz-clear":hz.level==="warn"?"hz-warn":"hz-red";
    const hzTxt = !hz?"判定中":hz.level==="clear"?"✅ クリア":hz.level==="warn"?"⚠ 要確認":"🚫 リスク";
    const kbCls = c.kubun==="昼間"?"kb-day":c.kubun==="夜間"?"kb-night":"kb-both";
    const stCls = c.status===ST_APPROVED?"st-approved":c.status===ST_EVAL?"st-eval":"st-cand";
    const stTxt = c.status===ST_APPROVED?"✅ 認定済":c.status===ST_EVAL?"📊 評価中":"🔍 候補";
    const icon  = TYPE_ICONS[c.typeKey]||TYPE_ICONS.default;
    const sc    = c.scores;
    const scCls = !sc?"":sc.total>=80?"sc-high":sc.total>=70?"sc-mid":"sc-low";

    const div = document.createElement("div");
    div.className = "cand-card" + (c.idx===selectedIdx?" selected":"");
    div.id = "card-"+c.idx;
    div.innerHTML = `
      <div class="cand-dist">${c.distStr}</div>
      <div class="cand-top">
        <span class="kb ${kbCls}">${c.kubun}</span>
        <span class="type-b">${icon} ${c.type}</span>
        <span class="hz-b ${hzCls}">${hzTxt}</span>
        <span class="status-b ${stCls}">${stTxt}</span>
      </div>
      <div class="cand-name">${c.name}</div>
      <div class="cand-addr">${c.address}</div>
      ${c.isOpen !== undefined ? `<div style="font-size:9px;margin-top:2px;color:${c.isOpen?'var(--safe)':'var(--danger)'}">${c.isOpen?'🟢 営業中':'🔴 営業時間外'}</div>` : ""}
      ${c.rating ? `<div style="font-size:9px;color:var(--muted);margin-top:1px;">⭐ ${c.rating} (${c.ratingCount}件)</div>` : ""}
      ${sc?`<div class="cand-score ${scCls}">総合 ${sc.total}点</div>`:""}
    `;
    div.onclick = () => selectCandidate(c.idx);
    list.appendChild(div);
  });
}

// ============================================================
// マーカー
// ============================================================
function clearMarkers() { markers.forEach(m=>m.marker.map=null); markers=[]; }
function placeMarkers() {
  clearMarkers();
  candidates.forEach((c, i) => {
    const el  = document.createElement("div");
    const col = c.status===ST_APPROVED?"#16a34a":c.kubun==="昼間"?"#1a7fe8":c.kubun==="夜間"?"#7c3aed":"#0d9488";
    const sz  = c.idx===selectedIdx ? 36 : 28;
    el.style.cssText = `width:${sz}px;height:${sz}px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25);border:2px solid #fff;cursor:pointer;background:${col};`;
    el.innerHTML = `<span style="transform:rotate(45deg);font-size:11px;">${TYPE_ICONS[c.typeKey]||"📍"}</span>`;
    const marker = new AdvancedMarkerElement({ position:{lat:c.lat,lng:c.lng}, map, title:c.name, content:el });
    marker.addListener("click", () => selectCandidate(c.idx));
    markers.push({ marker, element:el, idx:c.idx });
  });
}

// ============================================================
// 候補選択
// ============================================================
async function selectCandidate(idx) {
  selectedIdx = idx;
  const c = candidates.find(x => x.idx === idx);
  if (!c) return;

  document.querySelectorAll(".cand-card").forEach(el=>el.classList.remove("selected"));
  const card = document.getElementById("card-"+idx);
  if (card) { card.classList.add("selected"); card.scrollIntoView({behavior:"smooth",block:"nearest"}); }

  markers.forEach(m => {
    const isSel = m.idx === idx;
    m.element.style.width  = isSel?"36px":"28px";
    m.element.style.height = isSel?"36px":"28px";
    m.element.style.boxShadow = isSel?"0 0 0 4px rgba(232,65,10,.35),0 4px 12px rgba(0,0,0,.3)":"0 2px 8px rgba(0,0,0,.25)";
  });

  map.panTo({lat:c.lat,lng:c.lng});
  showDetailPanel(c);

  // Claude未生成なら生成
  if (!c.reason && generatingIdx !== idx) {
    generatingIdx = idx;
    showLoading("AIが選定理由・スコアを生成中...");
    try { await generateWithClaude(c); } finally { hideLoading(); generatingIdx = null; }
    renderList(); updateProgress();
    if (selectedIdx === idx) showDetailPanel(c);
  }

  // 重複チェック
  checkDuplicate(c);
}

function showDetailPanel(c) {
  const icon = TYPE_ICONS[c.typeKey]||TYPE_ICONS.default;
  const lat  = c.lat, lng = c.lng, z = 14;

  document.getElementById("dpIcon").textContent  = icon;
  document.getElementById("dpTitle").textContent = c.name;
  document.getElementById("dpSub").textContent   = `${c.type} ・ ${c.kubun} ・ ${c.status===ST_APPROVED?"✅認定済み":c.status===ST_EVAL?"📊評価中":"🔍候補"}`;

  // Googleマップリンク（3種）
  document.getElementById("dpMapLinks").innerHTML = `
    <a class="map-link ml-map" href="https://www.google.com/maps?q=${lat},${lng}" target="_blank">🗺️ Googleマップ</a>
    <a class="map-link ml-sv"  href="https://www.google.com/maps?layer=c&cbll=${lat},${lng}" target="_blank">📸 ストリートビュー</a>
    <a class="map-link ml-pl"  href="https://www.google.com/maps/place/?q=place_id:${c.placeId}" target="_blank">🏪 施設詳細</a>
  `;

  // スコア
  const sc = c.scores;
  if (sc) {
    const cls = sc.total>=80?"sb-high":sc.total>=70?"sb-mid":"sb-low";
    document.getElementById("dpScoreBadge").textContent = sc.total+"点";
    document.getElementById("dpScoreBadge").className   = "score-badge "+cls;
    document.getElementById("dpScoreBars").innerHTML = [
      {label:"耐災害性",val:sc.disaster},{label:"視認性",val:sc.visibility},
      {label:"近隣人口",val:sc.population},{label:"アクセス",val:sc.access},{label:"土地確保",val:sc.land}
    ].map(({label,val})=>{
      const bc = val>=80?"sbar-high":val>=70?"sbar-mid":"sbar-low";
      return `<div class="sbar-row"><span class="sbar-name">${label}</span><div class="sbar-track"><div class="sbar-fill ${bc}" style="width:${val}%"></div></div><span class="sbar-val">${val}</span></div>`;
    }).join("");
  } else {
    document.getElementById("dpScoreBadge").textContent = "生成中...";
    document.getElementById("dpScoreBars").innerHTML = "";
  }

  // ハザード
  const hz  = c.hazard;
  const hzEl= document.getElementById("dpHazard");
  hzEl.className   = "hz-res " + (!hz?"checking":hz.level);
  hzEl.textContent = !hz?"判定中...":hz.detail;
  document.getElementById("dpHzLinks").innerHTML = `
    <a class="hz-link flood"   href="https://disaportal.gsi.go.jp/hazardmap/maps/index.html?ll=${lat},${lng}&z=${z}&base=pale&ls=seamless%7Cflood_list_l2%2C0.8%7Cflood_l2_keizoku%2C0.8&disp=0101100000010100000000001&vs=c1j0l0u0t0h0z0" target="_blank">🌊 洪水</a>
    <a class="hz-link debris"  href="https://disaportal.gsi.go.jp/hazardmap/maps/index.html?ll=${lat},${lng}&z=${z}&base=pale&ls=seamless%7Cdosha_keikai_dosekiryu%2C0.8%7Cdosha_keikai_jisuberi%2C0.8&disp=0000000000011110000000001&vs=c1j0l0u0t0h0z0" target="_blank">⛰️ 土砂</a>
    <a class="hz-link tsunami" href="https://disaportal.gsi.go.jp/hazardmap/maps/index.html?ll=${lat},${lng}&z=${z}&base=pale&ls=seamless%7Ctsunamishinsui_raster%2C0.8&disp=0100010000000000000000001&vs=c1j0l0u0t0h0z0" target="_blank">🌏 津波</a>
    <a class="hz-link shelter" href="https://maps.gsi.go.jp/#${z}/${lat}/${lng}/&base=std&ls=std%7Cskhb01&disp=11&lcd=skhb01&vs=c1g1j0h0k0l0u0t0z0r0s0m0f0&d=m" target="_blank">🏥 避難所</a>
  `;

  // 基本情報
  document.getElementById("dpAddr").textContent  = c.address;
  document.getElementById("dpDist").textContent  = `${c.distStr} / 徒歩${c.walk}`;
  document.getElementById("dpKubun").textContent = c.kubun;
  document.getElementById("dpType").textContent  = c.type;

  // 営業・評価情報を動的追加
  const dpGrid = document.querySelector(".dp-grid");
  // 既存の動的セルを削除
  dpGrid.querySelectorAll(".dp-cell-dynamic").forEach(el => el.remove());
  if (c.isOpen !== undefined) {
    const openCell = document.createElement("div");
    openCell.className = "dp-cell dp-cell-dynamic";
    openCell.innerHTML = `<div class="dp-cl">営業状況</div><div class="dp-cv" style="color:${c.isOpen?"var(--safe)":"var(--danger)"}">${c.isOpen?"🟢 営業中":"🔴 営業時間外"}</div>`;
    dpGrid.appendChild(openCell);
  }
  if (c.rating) {
    const ratingCell = document.createElement("div");
    ratingCell.className = "dp-cell dp-cell-dynamic";
    ratingCell.innerHTML = `<div class="dp-cl">Google評価</div><div class="dp-cv">⭐ ${c.rating} <span style="font-size:9px;color:var(--muted)">(${c.ratingCount}件)</span></div>`;
    dpGrid.appendChild(ratingCell);
  }

  // Claude生成コンテンツ
  const setField = (id, val) => {
    const el = document.getElementById(id);
    if (val) { el.textContent = val; el.classList.remove("generating"); }
    else { el.textContent = "生成中..."; el.classList.add("generating"); }
  };
  setField("dpReason",      c.reason);
  setField("dpStock",       c.stock);
  setField("dpStockReason", c.stockReason);

  // 条件表示・非表示
  const condDisp = document.getElementById("dpConditionDisplay");
  if (c.status === ST_APPROVED && c.condition) {
    condDisp.style.display = "block";
    condDisp.innerHTML = `🔖 条件・備考：${c.condition}`;
  } else { condDisp.style.display = "none"; }

  // 条件入力欄（評価中のみ表示）
  const condBox = document.getElementById("dpConditionBox");
  const condInput = document.getElementById("dpConditionInput");
  if (c.status === ST_EVAL) {
    condBox.style.display = "block";
    condInput.value = c.condition || "";
  } else { condBox.style.display = "none"; }

  // 再検討ボックス非表示
  document.getElementById("dpReconsiderBox").classList.remove("visible");

  // アクションボタン描画
  renderActions(c);

  document.getElementById("dpDupMsg").style.display = c.duplicate ? "block" : "none";
  document.getElementById("detailPanel").classList.add("visible");
}

function renderActions(c) {
  const area = document.getElementById("dpActions");
  area.innerHTML = "";

  if (c.status === ST_CAND) {
    // AI評価ボタンのみ
    const row = document.createElement("div");
    row.className = "dp-action-row row-1";
    const btn = document.createElement("button");
    btn.className = "btn-register"; btn.textContent = "📊 AI評価を生成する";
    btn.onclick = async () => {
      showLoading("AIが評価中...");
      try { await generateWithClaude(c); renderList(); showDetailPanel(c); updateProgress(); }
      finally { hideLoading(); }
    };
    row.appendChild(btn); area.appendChild(row);

  } else if (c.status === ST_EVAL) {
    // 認定ボタン
    const row1 = document.createElement("div"); row1.className = "dp-action-row row-2";
    const btnApprove = document.createElement("button");
    btnApprove.className = "btn-register"; btnApprove.textContent = "✅ 認定して登録";
    btnApprove.disabled = c.duplicate;
    btnApprove.onclick = () => registerFacility(c);
    const btnRegen = document.createElement("button");
    btnRegen.className = "btn-regen"; btnRegen.textContent = "🔄 AI再評価";
    btnRegen.onclick = async () => {
      c.reason = null; c.stock = null; c.stockReason = null; c.scores = null; c.status = ST_CAND;
      showLoading("再評価中..."); try { await generateWithClaude(c); } finally { hideLoading(); }
      renderList(); showDetailPanel(c); updateProgress();
    };
    row1.appendChild(btnApprove); row1.appendChild(btnRegen); area.appendChild(row1);

  } else if (c.status === ST_APPROVED) {
    // 認定済みメッセージ + 再検討ボタン
    const msg = document.createElement("div"); msg.className = "approved-msg";
    msg.textContent = "✅ この拠点は認定済みです（シートに登録済み）"; area.appendChild(msg);
    const row = document.createElement("div"); row.className = "dp-action-row row-1";
    const btnRecon = document.createElement("button");
    btnRecon.className = "btn-reconsider"; btnRecon.textContent = "🔄 再検討に戻す";
    btnRecon.onclick = () => openReconsiderModal(c.idx);
    row.appendChild(btnRecon); area.appendChild(row);
  }
}

// ============================================================
// 拠点登録
// ============================================================
async function registerFacility(c) {
  const condition = document.getElementById("dpConditionInput").value.trim();
  c.condition = condition;

  showLoading("スプレッドシートに登録中...");
  try {
    const row = {
      "エリア番号":   currentArea?.id  || "",
      "区分":         c.kubun,
      "施設種類":     c.type,
      "施設名称":     c.name,
      "都道府県":     extractPref(c.address),
      "市区町村":     extractCity(c.address),
      "住所":         extractStreet(c.address),
      "緯度":         c.lat.toFixed(5),
      "経度":         c.lng.toFixed(5),
      "選定理由":     c.reason      || "",
      "配備した方が良い備蓄品（必須/推奨）": c.stock || "",
      "備蓄品選定理由": c.stockReason || "",
      "中心地距離":   c.distStr,
      "徒歩時間":     c.walk,
      "耐災":         c.scores?.disaster   || "",
      "視認性":       c.scores?.visibility || "",
      "近隣人口":     c.scores?.population || "",
      "アクセス":     c.scores?.access     || "",
      "土地確保":     c.scores?.land       || "",
      "スコア":       c.scores?.total      || "",
      "条件・備考":   condition,
      "Google Maps":  `https://www.google.com/maps?q=${c.lat},${c.lng}`,
      "営業状況":      c.isOpen !== undefined ? (c.isOpen ? "営業中" : "営業時間外") : "",
      "Google評価":    c.rating ? `${c.rating}点(${c.ratingCount}件)` : "",
      "ストリートビュー": `https://www.google.com/maps?layer=c&cbll=${c.lat},${c.lng}`,
    };

    const res  = await fetch(GAS_URL, { method:"POST", body: JSON.stringify({action:"addFacility", row}) });
    const data = await res.json();

    if (data.success) {
      c.status = ST_APPROVED;
      renderList(); placeMarkers(); showDetailPanel(c); updateProgress();
      showToast(data.message || "登録しました", "success");
    } else {
      showToast("登録失敗: " + (data.error||"不明なエラー"), "error");
    }
  } catch(e) { showToast("登録エラー: " + e.message, "error"); }
  finally { hideLoading(); }
}

// ============================================================
// 再検討（認定済み→評価中）
// ============================================================
function openReconsiderModal(idx) {
  reconsiderTargetIdx = idx;
  document.getElementById("reconsiderReasonInput").value = "";
  document.getElementById("reconsiderModal").classList.add("visible");
}
function closeReconsiderModal() {
  document.getElementById("reconsiderModal").classList.remove("visible");
  reconsiderTargetIdx = null;
}

async function confirmReconsider() {
  const reason = document.getElementById("reconsiderReasonInput").value.trim();
  if (!reason) { showToast("再検討理由を入力してください", "error"); return; }

  const c = candidates.find(x => x.idx === reconsiderTargetIdx);
  if (!c) return;
  closeReconsiderModal();

  // GASに再検討履歴を記録（updateFacility）
  showLoading("再検討を記録中...");
  try {
    c.status = ST_EVAL;
    c.reconsiderReason = reason;
    c.reconsiderDate   = new Date().toLocaleDateString("ja-JP");

    // GAS側に更新を通知（シートの該当行の「再検討日」「再検討理由」列を更新）
    const res  = await fetch(GAS_URL, { method:"POST", body: JSON.stringify({
      action: "updateFacilityStatus",
      name: c.name, lat: c.lat.toFixed(5), lng: c.lng.toFixed(5),
      reconsiderReason: reason, reconsiderDate: c.reconsiderDate
    })});
    const data = await res.json();
    if (!data.success && !data.skipped) showToast("記録失敗（ローカルは更新済み）", "error");

    renderList(); placeMarkers(); showDetailPanel(c);
    showToast("再検討に戻しました（理由を記録しました）", "success");
  } catch(e) {
    c.status = ST_EVAL; // ローカルは更新
    showToast("GAS記録エラー（ローカルのみ更新）", "error");
  } finally { hideLoading(); }
}

// ============================================================
// 進捗バー
// ============================================================
function updateProgress() {
  const needed   = parseInt(document.getElementById("neededInput").value) || 5;
  const approved = candidates.filter(c => c.status === ST_APPROVED).length;
  const pct = Math.min(approved / needed * 100, 100);
  const fill = document.getElementById("progressFill");
  fill.style.width = pct + "%";
  fill.style.background = pct >= 100 ? "var(--safe)" : pct >= 60 ? "var(--warn)" : "var(--danger)";
  document.getElementById("progressText").textContent = `${approved}/${needed}`;
}

// ============================================================
// 重複チェック
// ============================================================
async function checkDuplicate(c) {
  try {
    const res  = await fetch(GAS_URL, { method:"POST", body: JSON.stringify({action:"checkDuplicate", lat:c.lat, lng:c.lng, name:c.name}) });
    const data = await res.json();
    c.duplicate = data.isDuplicate;
    if (selectedIdx === c.idx) document.getElementById("dpDupMsg").style.display = c.duplicate ? "block" : "none";
  } catch(e) { /* GAS未設定時は無視 */ }
}

// ============================================================
// ユーティリティ
// ============================================================
function calcDist(la1,lo1,la2,lo2) {
  const R=6371000,dL=(la2-la1)*Math.PI/180,dG=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dG/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function placeAreaMarker(ll, name) {
  if (areaMarker) areaMarker.map = null;
  const el = document.createElement("div");
  el.style.cssText="width:38px;height:38px;border-radius:50%;background:#e8410a;border:3px solid #fff;box-shadow:0 3px 12px rgba(232,65,10,.5);display:flex;align-items:center;justify-content:center;font-size:17px;";
  el.textContent = "🏚";
  areaMarker = new AdvancedMarkerElement({position:ll,map,title:"起点："+name,content:el});
}
function drawCircle(ll) {
  if (searchCircle) searchCircle.setMap(null);
  searchCircle = new google.maps.Circle({
    center:ll, radius:SEARCH_RADIUS,
    strokeColor:"#e8410a",strokeOpacity:.5,strokeWeight:1.5,
    fillColor:"#e8410a",fillOpacity:.05,map
  });
}
function extractPref(addr)   { const m=addr.match(/^(東京都|北海道|(?:京都|大阪)府|.+?県)/);return m?m[1]:""; }
function extractCity(addr)   { const m=addr.match(/(?:都|道|府|県)(.+?[市区町村郡])/);return m?m[1]:addr.split(" ")[0]||""; }
function extractStreet(addr) { const m=addr.match(/[市区町村郡](.+)/);return m?m[1].trim():""; }
function clearResults() { candidates=[]; selectedIdx=null; clearMarkers(); closeDetail(); renderList(); updateProgress(); setStatus("エリアを選択してください"); document.getElementById("addBtn").disabled=true; }
function closeDetail() { document.getElementById("detailPanel").classList.remove("visible"); }
function setStatus(msg) { document.getElementById("statusText").textContent=msg; }
function showLoading(msg) { document.getElementById("loading").classList.add("visible"); document.getElementById("loadingTxt").textContent=msg||"処理中..."; }
function hideLoading() { document.getElementById("loading").classList.remove("visible"); }
function showToast(msg,type="") { const t=document.getElementById("toast"); t.textContent=msg; t.className="toast"+(type?" "+type:""); void t.offsetWidth; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),3200); }
</script>
